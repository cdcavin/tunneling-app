# Weekly Trackman sync. Credentials come from repository secrets and are never printed
# (GitHub masks secret values in logs).
name: Trackman sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = full sync without uploading (shows what would change); sync = full sync, uploads to R2; compare / peek / explore = diagnostics"
        required: true
        default: dry
        type: choice
        options: [dry, sync, compare, peek, explore]
  # schedule:                      # turned on once the sync step is written and tested
  #   - cron: "0 10 * * 1"         # Mondays 6 AM Eastern

concurrency:            # never two syncs writing at once
  group: trackman-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install paramiko==3.5.1 pandas==2.2.3 boto3==1.35.99
      - name: Run
        env:
          TM_FTP_HOST: ${{ secrets.TM_FTP_HOST }}
          TM_FTP_USER: ${{ secrets.TM_FTP_USER }}
          TM_FTP_PASS: ${{ secrets.TM_FTP_PASS }}
          TM_FTP_PROTOCOL: ${{ secrets.TM_FTP_PROTOCOL }}
          R2_KEY: ${{ secrets.R2_KEY }}
          R2_SECRET: ${{ secrets.R2_SECRET }}
          MODE: ${{ inputs.mode || 'sync' }}       # scheduled runs (no inputs) do the real sync
        run: python -I pipeline/tm_sync.py
