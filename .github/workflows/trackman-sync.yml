# Trackman sync, Monday and Wednesday early mornings. Credentials come from repository secrets and are never printed
# (GitHub masks secret values in logs).
name: Trackman sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry = full sync without uploading (shows what would change); sync = full sync, uploads to R2; reference = rebuild only the P4 reference; compare / peek / explore = diagnostics"
        required: true
        default: sync
        type: choice
        options: [sync, dry, reference, reference-dry, models, compare, peek, explore, spincols]
  schedule:                        # GitHub cron is UTC: 07:17 UTC = 3:17 AM Eastern in summer, 2:17 AM in winter
    - cron: "17 7 * * 1,3"         # early Monday morning (after the weekend) and early Wednesday morning (after Tuesday)

concurrency:            # never two syncs writing at once
  group: trackman-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install paramiko==3.5.1 pandas==2.2.3 boto3==1.35.99
      - name: Run
        env:
          TM_FTP_HOST: ${{ secrets.TM_FTP_HOST }}
          TM_FTP_USER: ${{ secrets.TM_FTP_USER }}
          TM_FTP_PASS: ${{ secrets.TM_FTP_PASS }}
          TM_FTP_PROTOCOL: ${{ secrets.TM_FTP_PROTOCOL }}
          R2_KEY: ${{ secrets.R2_KEY }}
          R2_SECRET: ${{ secrets.R2_SECRET }}
          MODE: ${{ inputs.mode || 'sync' }}       # scheduled runs (no inputs) do the real sync
        run: python -I pipeline/tm_sync.py
